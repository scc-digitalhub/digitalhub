{{ if and .Values.coder.enabled .Values.coder.workspace.upgrade.enabled (or .Values.coder.template.upgrade.token .Values.coder.existingSecrets.adminSessionTokenExistingSecret.secretName) (eq (include "digitalhub.coderTemplatesUpgradeRequired" .) "true") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-workspace-upgrade
  labels:
    {{- include "digitalhub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      initContainers:
        - name: coder-template-upgrade
          image: {{ .Subcharts.coder.Values.coder.image.repo }}:{{ .Subcharts.coder.Values.coder.image.tag }}
          command: ["/bin/bash", "/home/coder/init-files/upgrade-templates.sh"]
          env:
            {{- with .Subcharts.coder.Values.coder.env -}}
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- include "digitalhub.coderAccUrl" . | nindent 12 -}}
            - name: CODER_URL
              value: "http://coder.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CODER_SESSION_TOKEN
              {{- if .Values.coder.existingSecrets.adminSessionTokenExistingSecret.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coder.existingSecrets.adminSessionTokenExistingSecret.secretName }}
                  key: {{ .Values.coder.existingSecrets.adminSessionTokenExistingSecret.tokenKey }}
              {{- else }}
              value: {{ .Values.coder.template.upgrade.token }}
              {{- end }}
          volumeMounts:
          - name: init-files
            mountPath: "/home/coder/init-files"
            readOnly: true
          - name: custom-template
            mountPath: "/home/coder/custom-template"
            readOnly: true
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
      containers:
        - name: coder-workspace-upgrade
          image: {{ .Subcharts.coder.Values.coder.image.repo }}:{{ .Subcharts.coder.Values.coder.image.tag }}
          command: ["/bin/bash", "/home/coder/init-files/upgrade-workspaces.sh"]
          env:
            {{- with .Subcharts.coder.Values.coder.env -}}
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- include "digitalhub.coderAccUrl" . | nindent 12 -}}
            - name: CODER_URL
              value: "http://coder.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CODER_SESSION_TOKEN
              {{- if .Values.coder.existingSecrets.adminSessionTokenExistingSecret.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coder.existingSecrets.adminSessionTokenExistingSecret.secretName }}
                  key: {{ .Values.coder.existingSecrets.adminSessionTokenExistingSecret.tokenKey }}
              {{- else }}
              value: {{ .Values.coder.template.upgrade.token }}
              {{- end }}
          volumeMounts:
          - name: init-files
            mountPath: "/home/coder/init-files"
            readOnly: true
          - name: custom-template
            mountPath: "/home/coder/custom-template"
            readOnly: true
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
      restartPolicy: Never
      volumes:
        - name: init-files
          configMap:
            name: coder-init
        - name: custom-template
          configMap:
            name: coder-custom-template
{{- end }}

{{ if .Values.coder.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-init
  labels:
    {{- include "digitalhub.labels" . | nindent 4 }}
data:
  init.sh: | {{- tpl (.Files.Get "confs/coder/init.sh") . | nindent 4 }}
  upgrade-templates.sh: | {{- tpl (.Files.Get "confs/coder/upgrade-templates.sh") . | nindent 4 }}
  upgrade-workspaces.sh: | {{- tpl (.Files.Get "confs/coder/upgrade-workspaces.sh") . | nindent 4 }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "core.fullname" . }}
  labels:
    {{- include "core.labels" . | nindent 4 }}
  {{- $annotations := include "core.annotations" (dict "root" $ "resource" .Values.annotations.configmap) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
data:
  DH_NAME: {{ .Release.Name }}
  DH_ENDPOINT: "{{ include "core.endpoint" . }}"
  K8S_NAMESPACE: {{ .Release.Namespace }}
  JDBC_PLATFORM: postgresql
  JDBC_URL: {{ printf "%s%s:%s/%s" "jdbc:postgresql://" .Values.postgres.host .Values.postgres.port .Values.postgres.database }}
  JDBC_DRIVER: org.postgresql.Driver
  CONSOLE_USER_METRICS: {{ .Values.console.metrics.user | default "cpu,memory,volumes" }}
  CONSOLE_INSTANCE_METRICS: {{ .Values.console.metrics.instance | default "cpu,memory,volumes" }}
  CONSOLE_RUN_METRICS: {{ .Values.console.metrics.run | default "cpu,memory,volumes" }}
  CONSOLE_PROJECT_METRICS: {{ .Values.console.metrics.project | default "cpu,memory,volumes" }}
{{- if not .Values.sts.enabled }}
  DH_CONFIG_COMMON_SECRETS: {{ .Values.commonCredsSecret.secretName }}
{{- end }}
  DH_CONFIG_COMMON_MAPS: digitalhub-common-env
  LOG_LEVEL: {{ .Values.global.logLevel }}
  RUNTIME_DBT_IMAGE: {{ .Values.runtime.dbt.image }}:{{ .Values.runtime.dbt.tag }}
  RUNTIME_HERA_IMAGE: {{ .Values.runtime.hera.image }}:{{ .Values.runtime.hera.tag }}
  RUNTIME_PYTHON_IMAGE_3_10: {{ .Values.runtime.python.image }}:{{ .Values.runtime.python.tag3_10 }}
  RUNTIME_PYTHON_IMAGE_3_11: {{ .Values.runtime.python.image }}:{{ .Values.runtime.python.tag3_11 }}
  RUNTIME_PYTHON_IMAGE_3_12: {{ .Values.runtime.python.image }}:{{ .Values.runtime.python.tag3_12 }}
  RUNTIME_PYTHON_IMAGE_3_13: {{ .Values.runtime.python.image }}:{{ .Values.runtime.python.tag3_13 }}
  RUNTIME_HUGGINGFACE_SERVE_IMAGE: {{ .Values.runtime.huggingFace.image }}:{{ .Values.runtime.huggingFace.tag }}
  RUNTIME_VLLM_SERVE_IMAGE: {{ .Values.runtime.vllm.default.image }}:{{ .Values.runtime.vllm.default.tag }}
  RUNTIME_VLLM_SERVE_CPU_IMAGE: {{ .Values.runtime.vllm.cpu.image }}:{{ .Values.runtime.vllm.cpu.tag }}
  RUNTIME_PYTHON_INSTALL_DEPENDENCIES: {{ .Values.runtime.python.installDependencies | quote }}
  LLM_OTEL_ENDPOINT: {{ .Values.runtime.llmOtelEndpoint | quote }}
  RUNTIME_FLOWER_CLIENT: {{ printf "%s:%s" .Values.runtime.flower.client.image .Values.runtime.flower.client.tag | quote }}
  RUNTIME_FLOWER_GROUP_ID: {{ .Values.runtime.flower.groupId | quote }}
  RUNTIME_FLOWER_RUNNER: {{ printf "%s:%s" .Values.runtime.flower.runner.image .Values.runtime.flower.runner.tag | quote }}
  RUNTIME_FLOWER_SERVER: {{ printf "%s:%s" .Values.runtime.flower.server.image .Values.runtime.flower.server.tag | quote }}
  RUNTIME_FLOWER_TLS_CA_CERT: {{ .Values.runtime.flower.tls.caCert | quote }}
  RUNTIME_FLOWER_TLS_CA_KEY: {{ .Values.runtime.flower.tls.caKey | quote }}
  RUNTIME_FLOWER_TLS_CONF: {{ .Values.runtime.flower.tls.conf | quote }}
  RUNTIME_FLOWER_TLS_EXT_DOMAIN: {{ .Values.runtime.flower.tls.externalDomain | quote }}
  RUNTIME_FLOWER_TLS_INT_DOMAIN: {{ .Values.runtime.flower.tls.internalDomain | default .Release.Namespace | quote }}
  RUNTIME_FLOWER_USER_ID: {{ .Values.runtime.flower.userId | quote }}
  RUNTIME_HERA_DURATION: {{ .Values.runtime.hera.duration | toString | default .Values.coreTokens.refreshTokenDuration | quote }}
  RUNTIME_KFP_DURATION: {{ .Values.runtime.kfp.duration | toString | default .Values.coreTokens.refreshTokenDuration | quote }}
  RUNTIME_KFP_IMAGE: {{ printf "%s:%s" .Values.runtime.kfp.image .Values.runtime.kfp.tag | quote }}
  RUNTIME_HUGGINGFACE_GROUP_ID: {{ .Values.runtime.huggingFace.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_HUGGINGFACE_USER_ID: {{ .Values.runtime.huggingFace.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_HUGGINGFACE_VOLUME_SIZE: {{ .Values.runtime.huggingFace.volumeSize | quote }}
  RUNTIME_MLFLOW_SERVE_GROUP_ID: {{ .Values.runtime.mlflow.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_MLFLOW_SERVE_IMAGE: {{ printf "%s:%s" .Values.runtime.mlflow.image .Values.runtime.mlflow.tag | quote }}
  RUNTIME_MLFLOW_SERVE_USER_ID: {{ .Values.runtime.mlflow.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_MLFLOW_VOLUME_SIZE: {{ .Values.runtime.mlflow.volumeSize | quote }}
  RUNTIME_SKLEARN_SERVE_GROUP_ID: {{ .Values.runtime.sklearn.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_SKLEARN_SERVE_IMAGE: {{ printf "%s:%s" .Values.runtime.sklearn.image .Values.runtime.sklearn.tag | quote }}
  RUNTIME_SKLEARN_SERVE_USER_ID: {{ .Values.runtime.sklearn.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_SKLEARN_VOLUME_SIZE: {{ .Values.runtime.sklearn.volumeSize | quote }}
  RUNTIME_VLLM_GROUP_ID: {{ .Values.runtime.vllm.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_VLLM_HOME_DIR: {{ .Values.runtime.vllm.homeDir | quote }}
  RUNTIME_VLLM_MEM_SIZE: {{ .Values.runtime.vllm.memSize | quote }}
  RUNTIME_VLLM_SERVE_CPU_IMAGE_AUDIO: {{ printf "%s:%s" (.Values.runtime.vllm.cpu.audioImage | default .Values.runtime.vllm.cpu.image) (.Values.runtime.vllm.cpu.audioTag | default .Values.runtime.vllm.cpu.tag) | quote }}
  RUNTIME_VLLM_SERVE_IMAGE_AUDIO: {{ printf "%s:%s" (.Values.runtime.vllm.default.audioImage | default .Values.runtime.vllm.default.image) (.Values.runtime.vllm.default.audioTag | default .Values.runtime.vllm.default.tag) | quote }}
  RUNTIME_VLLM_USER_ID: {{ .Values.runtime.vllm.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_VLLM_VOLUME_SIZE: {{ .Values.runtime.vllm.volumeSize | quote }}
  RUNTIME_PYTHON_BASE_IMAGE_3_10: {{ printf "%s:%s" .Values.runtime.python.baseImage.image .Values.runtime.python.baseImage.tag3_10 | quote }}
  RUNTIME_PYTHON_BASE_IMAGE_3_11: {{ printf "%s:%s" .Values.runtime.python.baseImage.image .Values.runtime.python.baseImage.tag3_11 | quote }}
  RUNTIME_PYTHON_BASE_IMAGE_3_12: {{ printf "%s:%s" .Values.runtime.python.baseImage.image .Values.runtime.python.baseImage.tag3_12 | quote }}
  RUNTIME_PYTHON_BASE_IMAGE_3_13: {{ printf "%s:%s" .Values.runtime.python.baseImage.image .Values.runtime.python.baseImage.tag3_13 | quote }}
  RUNTIME_PYTHON_COMMAND: {{ .Values.runtime.python.command | quote }}
  RUNTIME_PYTHON_DEPENDENCIES: {{ .Values.runtime.python.dependencies | quote }}
  RUNTIME_PYTHON_GROUP_ID: {{ .Values.runtime.python.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_PYTHON_HOME_DIR: {{ .Values.runtime.python.homeDir | quote }}
  RUNTIME_PYTHON_IMAGE_3_9: {{ printf "%s:%s" .Values.runtime.python.image .Values.runtime.python.tag3_9 | quote }}
  RUNTIME_PYTHON_SERVERLESS_IMAGE_3_10: {{ printf "%s:%s" .Values.runtime.python.serverless.image .Values.runtime.python.serverless.tag3_10 | quote }}
  RUNTIME_PYTHON_SERVERLESS_IMAGE_3_11: {{ printf "%s:%s" .Values.runtime.python.serverless.image .Values.runtime.python.serverless.tag3_11 | quote }}
  RUNTIME_PYTHON_SERVERLESS_IMAGE_3_12: {{ printf "%s:%s" .Values.runtime.python.serverless.image .Values.runtime.python.serverless.tag3_12 | quote }}
  RUNTIME_PYTHON_SERVERLESS_IMAGE_3_13: {{ printf "%s:%s" .Values.runtime.python.serverless.image .Values.runtime.python.serverless.tag3_13 | quote }}
  RUNTIME_PYTHON_USER_ID: {{ .Values.runtime.python.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_PYTHON_USE_BETA_DEPENDENCIES: {{ .Values.runtime.python.useBetaDependencies | quote }}
  RUNTIME_PYTHON_VOLUME_SIZE: {{ .Values.runtime.python.volumeSize | quote }}
  RUNTIME_GUARDRAIL_BASE_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.guardrail.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.guardrail.baseImage.tag3_10 | default .Values.runtime.python.baseImage.tag3_10) | quote }}
  RUNTIME_GUARDRAIL_BASE_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.guardrail.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.guardrail.baseImage.tag3_11 | default .Values.runtime.python.baseImage.tag3_11) | quote }}
  RUNTIME_GUARDRAIL_BASE_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.guardrail.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.guardrail.baseImage.tag3_12 | default .Values.runtime.python.baseImage.tag3_12) | quote }}
  RUNTIME_GUARDRAIL_BASE_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.guardrail.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.guardrail.baseImage.tag3_13 | default .Values.runtime.python.baseImage.tag3_13) | quote }}
  RUNTIME_GUARDRAIL_COMMAND: {{ .Values.runtime.guardrail.command | default .Values.runtime.python.command | quote }}
  RUNTIME_GUARDRAIL_DEPENDENCIES: {{ .Values.runtime.guardrail.dependencies | quote }}
  RUNTIME_GUARDRAIL_GROUP_ID: {{ .Values.runtime.guardrail.groupId | toString | default (.Values.runtime.python.groupId | toString) | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_GUARDRAIL_HOME_DIR: {{ .Values.runtime.guardrail.homeDir | default .Values.runtime.python.homeDir | quote }}
  RUNTIME_GUARDRAIL_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.guardrail.image | default .Values.runtime.python.image) (.Values.runtime.guardrail.tag3_10 | default .Values.runtime.python.tag3_10) | quote }}
  RUNTIME_GUARDRAIL_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.guardrail.image | default .Values.runtime.python.image) (.Values.runtime.guardrail.tag3_11 | default .Values.runtime.python.tag3_11) | quote }}
  RUNTIME_GUARDRAIL_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.guardrail.image | default .Values.runtime.python.image) (.Values.runtime.guardrail.tag3_12 | default .Values.runtime.python.tag3_12) | quote }}
  RUNTIME_GUARDRAIL_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.guardrail.image | default .Values.runtime.python.image) (.Values.runtime.guardrail.tag3_13 | default .Values.runtime.python.tag3_13) | quote }}
  RUNTIME_GUARDRAIL_INSTALL_DEPENDENCIES: {{ ternary .Values.runtime.python.installDependencies .Values.runtime.guardrail.installDependencies (kindIs "invalid" .Values.runtime.guardrail.installDependencies) | quote }}
  RUNTIME_GUARDRAIL_SERVERLESS_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.guardrail.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.guardrail.serverless.tag3_10 | default .Values.runtime.python.serverless.tag3_10) | quote }}
  RUNTIME_GUARDRAIL_SERVERLESS_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.guardrail.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.guardrail.serverless.tag3_11 | default .Values.runtime.python.serverless.tag3_11) | quote }}
  RUNTIME_GUARDRAIL_SERVERLESS_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.guardrail.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.guardrail.serverless.tag3_12 | default .Values.runtime.python.serverless.tag3_12) | quote }}
  RUNTIME_GUARDRAIL_SERVERLESS_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.guardrail.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.guardrail.serverless.tag3_13 | default .Values.runtime.python.serverless.tag3_13) | quote }}
  RUNTIME_GUARDRAIL_USER_ID: {{ .Values.runtime.guardrail.userId | toString | default (.Values.runtime.python.userId | toString) | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_GUARDRAIL_USE_BETA_DEPENDENCIES: {{ ternary .Values.runtime.python.useBetaDependencies .Values.runtime.guardrail.useBetaDependencies (kindIs "invalid" .Values.runtime.guardrail.useBetaDependencies) | quote }}
  RUNTIME_GUARDRAIL_VOLUME_SIZE: {{ .Values.runtime.guardrail.volumeSize | default .Values.runtime.python.volumeSize | quote }}
  RUNTIME_OPENINFERENCE_BASE_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.openInference.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.openInference.baseImage.tag3_10 | default .Values.runtime.python.baseImage.tag3_10) | quote }}
  RUNTIME_OPENINFERENCE_BASE_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.openInference.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.openInference.baseImage.tag3_11 | default .Values.runtime.python.baseImage.tag3_11) | quote }}
  RUNTIME_OPENINFERENCE_BASE_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.openInference.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.openInference.baseImage.tag3_12 | default .Values.runtime.python.baseImage.tag3_12) | quote }}
  RUNTIME_OPENINFERENCE_BASE_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.openInference.baseImage.image | default .Values.runtime.python.baseImage.image) (.Values.runtime.openInference.baseImage.tag3_13 | default .Values.runtime.python.baseImage.tag3_13) | quote }}
  RUNTIME_OPENINFERENCE_COMMAND: {{ .Values.runtime.openInference.command | default .Values.runtime.python.command | quote }}
  RUNTIME_OPENINFERENCE_DEPENDENCIES: {{ .Values.runtime.openInference.dependencies | quote }}
  RUNTIME_OPENINFERENCE_GROUP_ID: {{ .Values.runtime.openInference.groupId | toString | default (.Values.runtime.python.groupId | toString) | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_OPENINFERENCE_HOME_DIR: {{ .Values.runtime.openInference.homeDir | default .Values.runtime.python.homeDir | quote }}
  RUNTIME_OPENINFERENCE_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.openInference.image | default .Values.runtime.python.image) (.Values.runtime.openInference.tag3_10 | default .Values.runtime.python.tag3_10) | quote }}
  RUNTIME_OPENINFERENCE_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.openInference.image | default .Values.runtime.python.image) (.Values.runtime.openInference.tag3_11 | default .Values.runtime.python.tag3_11) | quote }}
  RUNTIME_OPENINFERENCE_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.openInference.image | default .Values.runtime.python.image) (.Values.runtime.openInference.tag3_12 | default .Values.runtime.python.tag3_12) | quote }}
  RUNTIME_OPENINFERENCE_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.openInference.image | default .Values.runtime.python.image) (.Values.runtime.openInference.tag3_13 | default .Values.runtime.python.tag3_13) | quote }}
  RUNTIME_OPENINFERENCE_INSTALL_DEPENDENCIES: {{ ternary .Values.runtime.python.installDependencies .Values.runtime.openInference.installDependencies (kindIs "invalid" .Values.runtime.openInference.installDependencies) | quote }}
  RUNTIME_OPENINFERENCE_SERVERLESS_IMAGE_3_10: {{ printf "%s:%s" (.Values.runtime.openInference.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.openInference.serverless.tag3_10 | default .Values.runtime.python.serverless.tag3_10) | quote }}
  RUNTIME_OPENINFERENCE_SERVERLESS_IMAGE_3_11: {{ printf "%s:%s" (.Values.runtime.openInference.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.openInference.serverless.tag3_11 | default .Values.runtime.python.serverless.tag3_11) | quote }}
  RUNTIME_OPENINFERENCE_SERVERLESS_IMAGE_3_12: {{ printf "%s:%s" (.Values.runtime.openInference.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.openInference.serverless.tag3_12 | default .Values.runtime.python.serverless.tag3_12) | quote }}
  RUNTIME_OPENINFERENCE_SERVERLESS_IMAGE_3_13: {{ printf "%s:%s" (.Values.runtime.openInference.serverless.image | default .Values.runtime.python.serverless.image) (.Values.runtime.openInference.serverless.tag3_13 | default .Values.runtime.python.serverless.tag3_13) | quote }}
  RUNTIME_OPENINFERENCE_USER_ID: {{ .Values.runtime.openInference.userId | toString | default (.Values.runtime.python.userId | toString) | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_OPENINFERENCE_USE_BETA_DEPENDENCIES: {{ ternary .Values.runtime.python.useBetaDependencies .Values.runtime.openInference.useBetaDependencies (kindIs "invalid" .Values.runtime.openInference.useBetaDependencies) | quote }}
  RUNTIME_OPENINFERENCE_VOLUME_SIZE: {{ .Values.runtime.openInference.volumeSize | default .Values.runtime.python.volumeSize | quote }}
  RUNTIME_SERVICEGRAPH_COMMAND: {{ .Values.runtime.servicegraph.command | quote }}
  RUNTIME_SERVICEGRAPH_GROUP_ID: {{ .Values.runtime.servicegraph.groupId | toString | default (.Values.additionalConfig.security.group | toString) | quote }}
  RUNTIME_SERVICEGRAPH_IMAGE: {{ printf "%s:%s" .Values.runtime.servicegraph.image .Values.runtime.servicegraph.tag | quote }}
  RUNTIME_SERVICEGRAPH_USER_ID: {{ .Values.runtime.servicegraph.userId | toString | default (.Values.additionalConfig.security.user | toString) | quote }}
  RUNTIME_SERVICEGRAPH_VOLUME_SIZE: {{ .Values.runtime.servicegraph.volumeSize | quote }}
{{- if .Values.solr.enabled }}
  SOLR_URL: {{ .Values.solr.url }}
  SOLR_COLLECTION: {{ .Values.solr.collection.name }}
{{- end }}
{{- if .Values.authentication.basic.enabled }}
  DH_AUTH_BASIC_USER: {{ .Values.authentication.basic.username }}
  DH_AUTH_BASIC_PASSWORD: {{ .Values.authentication.basic.password }}
{{- end }}
{{- if .Values.authentication.openId.enabled }}
  {{- if .Values.authentication.openId.jwtAudience }}
  DH_AUTH_JWT_ISSUER_URI: {{ .Values.authentication.openId.issuerUri }}
  DH_AUTH_JWT_AUDIENCE: {{ .Values.authentication.openId.jwtAudience }}
  {{- end }}
  DH_AUTH_JWT_CLAIM: {{ .Values.authentication.openId.jwtClaim }}
  DH_AUTH_OIDC_ISSUER_URI: {{ .Values.authentication.openId.issuerUri }}
  DH_AUTH_OIDC_SCOPE: {{ .Values.authentication.openId.scope }}
  DH_AUTH_JWT_USERNAME: {{ .Values.authentication.openId.jwtUsername }}
{{- end }}
{{- if .Values.global.ociRegistry.url }}
  IMAGE_REGISTRY: {{ .Values.global.ociRegistry.url }}
  CONTAINER_IMAGES_REGISTRY: {{ .Values.console.containerImagesRegistry.registryUrl | default .Values.global.ociRegistry.url }}
  BUILDER_IMAGE_PREFIX: {{ .Values.registry.kaniko.imagePrefix | default .Release.Namespace }}
  IMAGE_REGISTRY_SECRET: {{ .Values.global.ociRegistry.secretName }}
  {{- if eq .Values.builder.framework.name "kaniko" }}
  BUILDER_FRAMEWORK: {{ .Values.builder.framework.name }}
  KANIKO_IMAGE: {{ .Values.builder.framework.image }}
  {{ if .Values.builder.framework.secret -}}KANIKO_SECRET: {{ .Values.builder.framework.secret }}{{- end }}
  {{ if .Values.builder.framework.args -}}KANIKO_ARGS: {{ join "," .Values.builder.framework.args | quote }}{{- end }}
  {{- else if eq .Values.builder.framework.name "buildkit" }}
  BUILDER_FRAMEWORK: {{ .Values.builder.framework.name }}
  BUILDKIT_IMAGE: {{ .Values.builder.framework.image }}
  {{- if .Values.builder.framework.secret }}BUILDKIT_SECRET: {{ .Values.builder.framework.secret }}{{ end }}
  BUILDKIT_COMMAND: {{ .Values.builder.framework.command }}
  BUILDKIT_ARGS: {{ join "," .Values.builder.framework.args | quote }}
  {{ if index .Values "builder" "framework" "client-secret" "name" -}}BUILDKIT_CLIENT_SECRET_NAME: {{ index .Values "builder" "framework" "client-secret" "name" }}{{- end }}
  {{ if index .Values "builder" "framework" "client-secret" "mount-path" -}}BUILDKIT_CLIENT_SECRET_MOUNT_PATH: {{ index .Values "builder" "framework" "client-secret" "mount-path" }}{{- end }}
  {{- end }}
{{- end }}
  DH_CORS_ORIGINS: {{ .Values.corsOrigin | quote }}
{{- if and .Values.keystore.existingSecret.secretName .Values.keystore.keystorePath }}
  JWT_KEYSTORE_PATH: "{{ .Values.keystore.keystorePath }}/{{ .Values.keystore.existingSecret.keyName }}"
  JWT_KEYSTORE_KID: {{ .Values.keystore.keystoreKid | quote }}
{{- else if and (not .Values.keystore.existingSecret.secretName) .Values.keystore.keystorePath }}
  JWT_KEYSTORE_PATH: "{{ .Values.keystore.keystorePath }}/keystore.jwks"
  JWT_KEYSTORE_KID: {{ .Values.keystore.keystoreKid | quote }}
{{- end }}
  JWT_ACCESS_TOKEN_DURATION: {{ .Values.coreTokens.accessTokenDuration | quote }}
  JWT_REFRESH_TOKEN_DURATION: {{ .Values.coreTokens.refreshTokenDuration | quote }}
  S3_CREDENTIALS_PROVIDER: {{ if .Values.s3.enabled }}"true"{{ else }}"false"{{ end }}
{{- if .Values.s3.enabled }}
  {{ if .Values.s3.credentials.policy}}S3_CREDENTIALS_POLICY: {{ .Values.s3.credentials.policy | quote }}{{ end }}
  S3_SIGNATURE_VERSION: {{ .Values.s3.signatureVersion }}
  S3_PATH_STYLE_ACCESS: {{ .Values.s3.pathStyleAccess | quote }}
  {{ if .Values.s3.credentials.claimPrefix }}S3_CREDENTIALS_CLAIM_PREFIX: {{ .Values.s3.credentials.claimPrefix | quote }}{{ end }}
  {{ if .Values.s3.credentials.roleArn }}S3_CREDENTIALS_ROLE_ARN: {{ .Values.s3.credentials.roleArn }}{{ end }}
  AWS_DEFAULT_REGION: {{ .Values.s3.region }}
  FILES_DEFAULT_STORE: s3://{{ .Values.s3.bucket }}
  S3_ENDPOINT_URL: {{ .Values.s3.publicUrl }}
  S3_BUCKET: {{ .Values.s3.bucket }}
  S3_CREDENTIALS_DURATION: {{ .Values.s3.credentials.duration | quote }}
{{- end }}
{{- if .Values.templates }}
  K8S_TEMPLATES: {{ include "core.templates" . | quote }}
{{- end }}
  K8S_INIT_IMAGE: "{{ .Values.initImage.builderTool.image }}:{{ .Values.initImage.builderTool.tag }}"
  K8S_ENABLE_METRICS: {{ if not .Values.prometheus.enabled }}{{ .Values.additionalConfig.debug.enableMetrics | quote }}{{ else }}"false"{{ end }}
  K8S_ENABLE_LOGS: {{ if not .Values.loki.enabled }}{{ .Values.additionalConfig.debug.enableLogs | quote }}{{ else }}"false"{{ end }}
  K8S_SEC_DISABLE_ROOT: {{ .Values.additionalConfig.security.disableRoot | quote }}
  K8S_RESOURCE_CPU_DEFAULT: {{ .Values.additionalConfig.resources.cpuReq | quote }}
  K8S_RESOURCE_CPU_LIMIT: {{ .Values.additionalConfig.resources.cpuLim | quote }}
  K8S_RESOURCE_MEM_DEFAULT: {{ .Values.additionalConfig.resources.memReq | quote }}
  K8S_RESOURCE_MEM_LIMIT: {{ .Values.additionalConfig.resources.memLim | quote }}
  K8S_RESOURCE_GPU_KEY: {{ .Values.additionalConfig.resources.gpuKey | quote }}
  K8S_SERVICE_TYPE: {{ .Values.additionalConfig.service.type | quote }}
  K8S_JOB_DEADLINE: {{ .Values.additionalConfig.job.deadline | quote }}
  K8S_JOB_SUSPEND: {{ .Values.additionalConfig.job.jobSuspend | quote }}
  K8S_IMAGE_PULL_POLICY: {{ .Values.additionalConfig.image.pullPolicy | quote }}
  K8S_RESOURCE_EPHEMERAL_STORAGE_CLASS: {{ .Values.additionalConfig.ephemeralVolume.storageClass | quote }}
  K8S_RESOURCE_EPHEMERAL_LIMIT: {{ .Values.additionalConfig.ephemeralVolume.limits | quote }}
  K8S_RESOURCE_EPHEMERAL_DEFAULT: {{ .Values.additionalConfig.ephemeralVolume.requests | quote }}
  K8S_RESOURCE_PVC_STORAGE_CLASS: {{ .Values.additionalConfig.persistenVolumeClaim.storageClass | quote }}
  K8S_RESOURCE_PVC_LIMIT: {{ .Values.additionalConfig.persistenVolumeClaim.limits | quote }}
  K8S_RESOURCE_PVC_DEFAULT: {{ .Values.additionalConfig.persistenVolumeClaim.requests | quote }}

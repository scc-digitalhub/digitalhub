#  global --
global:
  #  global.externalHostAddress --
  externalHostAddress: ""
  #  global.externalTls --
  externalTls: false
  logLevel: INFO
  #  global.ociRegistry -- Values of your registry
  ociRegistry:
    #  global.ociRegistry.email -- Registry email
    email: ""
    #  global.ociRegistry.password -- Registry password
    password: ""
    #  global.ociRegistry.secretName -- Name of the secret of your registry. It has higher priority.
    secretName: ""
    #  global.ociRegistry.url -- Registry url
    url: ""
    #  global.ociRegistry.username -- Registry username
    username: ""

#  additionalConfig --
additionalConfig:
  #  additionalConfig.customApiGroups -- Custom API groups that Core should be aware of, specified as a comma separated list of group/version
  customApiGroups: kubeai.org/v1
  #  additionalConfig.debug --
  debug:
    #  additionalConfig.debug.enableLogs -- Enable/disable logging
    enableLogs: true
    #  additionalConfig.debug.enableMetrics -- Enable/disable metrics
    enableMetrics: false
    # additionalConfig.debug.enableResults -- Result collection mode.
    enableResults: default
  # additionalConfig.emptyDir -- Empty directory volume configuration.
  emptyDir:
    # additionalConfig.emptyDir.medium -- Storage medium for empty directory volumes.
    medium: ""
    # additionalConfig.emptyDir.size -- Maximum empty directory size.
    size: 128Mi
  #  additionalConfig.ephemeralVolume -- Ephemeral Volumes configurations
  ephemeralVolume:
    # additionalConfig.ephemeral.limits -- Configure max size for the ephemeral storage volumes
    limits: ""
    # additionalConfig.ephemeral.requests -- Configure the default size for all ephemeral storage volumes can be overrided by users
    requests: ""
    # additionalConfig.ephemeral.storageClass -- Specify the storage class for ephemeral storage
    storageClass: ""
  #  additionalConfig.image --
  image:
    # additionalConfig.image.pullPolicy -- Configure pull image pull policy for workload scheduled by core
    pullPolicy: IfNotPresent
  #  additionalConfig.job -- Jobs configuration
  job:
    #  additionalConfig.job.deadline -- Set deadline for jobs
    deadline: "604800"
    #  additionalConfig.job.jobSuspend -- Suspend jobs
    jobSuspend: false
  # additionalConfig.monitorsDelay -- Monitor polling delay in seconds.
  monitorsDelay: 10
  #  additionalConfig.persistenVolumeClaim -- Persisten Volume Claim configurations
  persistenVolumeClaim:
    # additionalConfig.persistenVolumeClaim.limits -- Configure max size for the Persisten Volume Claim volumes
    limits: ""
    # additionalConfig.persistenVolumeClaim.requests -- Configure the default size for all Persisten Volume Claim volumes can be overrided by users
    requests: ""
    # additionalConfig.persistenVolumeClaim.storageClass -- Specify the storage class for Persisten Volume Claim
    storageClass: ""
  # additionalConfig.registrySecret -- Image registry secret; empty inherits the global registry secret.
  registrySecret: ""
  #  additionalConfig.resources -- Resources for the pods created by Core
  resources:
    #  additionalConfig.resources.cpuLim -- CPU limit
    cpuLim: ""
    #  additionalConfig.resources.cpuReq -- CPU request
    cpuReq: ""
    #  additionalConfig.resources.gpuKey -- GPU key
    gpuKey: ""
    #  additionalConfig.resources.memLim -- Memory limit
    memLim: ""
    #  additionalConfig.resources.memReq -- Memory request
    memReq: ""
    # additionalConfig.resources.memToleration -- Memory resource tolerance multiplier.
    memToleration: 1.1
  #  additionalConfig.security --
  security:
    #  additionalConfig.security.disableRoot -- Disable root for pods created by Core
    disableRoot: true
    # additionalConfig.security.group -- Group ID for workload containers.
    group: ""
    # additionalConfig.security.seccompProfile -- Seccomp profile for workload containers.
    seccompProfile: RuntimeDefault
    # additionalConfig.security.user -- User ID for workload containers.
    user: ""
  #  additionalConfig.service --
  service:
    #  additionalConfig.service.type -- Service type for pods created by Core
    type: NodePort
  #  additionalConfig.workflowVolume -- Workflow configuration
  workflow:
    #  additionalConfig.workflow.volume -- Workflow volume configuration
    volume:
      #  additionalConfig.workflow.volume.accessMode -- Access mode for the workflow volume
      accessMode: ReadWriteMany
      # additionalConfig.workflowVolume.storageClassName -- Specify the storage class for the workflow volume
      storageClassName: ""

#  affinity -- Affinity for pod assignment.
affinity: {}

# annotations -- Annotations to add to all resources.
annotations:
  # annotations.global -- Annotations to add to all resources.
  global: {}
  # annotations.configmap -- Annotations for configmaps
  configmap: {}
  # annotations.deployment -- Annotations for deployments
  deployment: {}
  # annotations.secret -- Annotations for secrets
  secret: {}
  # annotations.service -- Annotations for services
  service: {}

# application -- Core application metadata.
application:
  # application.apiLevel -- API level.
  apiLevel: ""
  # application.contacts -- Application contact information.
  contacts:
    # application.contacts.email -- Contact email address.
    email: ""
    # application.contacts.link -- Contact URL.
    link: https://github.com/scc-digitalhub/digitalhub-core
    # application.contacts.name -- Contact name.
    name: "@project.name@"

#  argoWorkflow -- Argoworkflow configuration
argoWorkflow:
  #  argoWorkflow.configmap -- Name of the configmap containing the artifact repositories that the Argo Workflows should use
  configmap: artifact-repositories
  #  argoWorkflow.key -- Key of the artifact repository in the configmap
  key: default-artifact-repository
  #  argoWorkflow.serviceAccount -- Service account name.
  serviceAccount: default
  #  argoWorkflow.user --
  user: "1000"

#  authentication -- Authentication configuration
authentication:
  #  authentication.basic -- Basic Auth values
  basic:
    #  authentication.basic.enabled -- Enable/disable basicAuth authentication
    enabled: true
    #  authentication.basic.password -- BasicAuth password
    password: ""
    #  authentication.basic.username -- BasicAuth username
    username: ""
  #  authentication.openId -- OpenID Auth values
  openId:
    #  authentication.openId.enabled -- Enable/disable openId authentication
    enabled: false
    # authentication.openId.claim -- OIDC claim; empty inherits the JWT claim.
    claim: ""
    # authentication.openId.clientName -- OIDC client name; empty uses the release name.
    clientName: ""
    # authentication.openId.clientSecret -- OIDC client secret, stored in the ConfigMap when configured.
    clientSecret: ""
    #  authentication.openId.externalSecret -- Reference to the Core OpenID Secret
    externalSecret:
      #  authentication.openId.externalSecret.key -- Key of the openId clientId
      key: ""
      #  authentication.openId.externalSecret.name -- OpenID secret name
      name: ""
    #  authentication.openId.issuerUri -- OpenId Issuer url
    issuerUri: ""
    #  authentication.openId.jwtAudience -- OpenId JWT Audience
    jwtAudience: ""
    #  authentication.openId.jwtClaim -- OpenId JWT claims
    jwtClaim: ""
    #  authentication.openId.jwtUsername -- OpenId JWT username
    jwtUsername: ""
    #  authentication.openId.oidcClientId -- OpenId JWT clientID
    oidcClientId: ""
    #  authentication.openId.scope -- OpenId JWT Scopes
    scope: ""
    # authentication.openId.username -- OIDC username attribute.
    username: preferred_username

#  autoscaling -- Adjusts the number of replicas in a workload to match observed resource utilization such as CPU or memory usage.
autoscaling:
  #  autoscaling.enabled -- Enable horizontal scaling
  enabled: false
  #  autoscaling.maxReplicas -- Set max replicas for autoscaling
  maxReplicas: 100
  #  autoscaling.minReplicas -- Set min replicas for autoscaling
  minReplicas: 1
  #  autoscaling.targetCPUUtilizationPercentage -- Set CPU utilization percentage that trigger the autoscaling
  targetCPUUtilizationPercentage: 80

#  builder -- Configure OCI image builder
builder:
  # builder.buildkit -- BuildKit image registry configuration.
  buildkit:
    # builder.buildkit.imagePrefix -- Image prefix; empty inherits the framework image prefix.
    imagePrefix: ""
    # builder.buildkit.imageRegistry -- Registry; empty inherits the global registry URL.
    imageRegistry: ""
    # builder.buildkit.registryInsecure -- Allow an insecure registry.
    registryInsecure: false
  framework:
    #  builder.framework.args -- Override/append arguments defined in the builder image
    args: ""
    #  builder.framework.client-secret -- Specify mTLS client secret used by buildkit cli to authenticate to a remote buildkit deamon
    client-secret:
      #  builder.framework.client-secret.mount-path: -- Mount path where the certificates are mounted inside the container
      mount-path: ""
      #  builder.framework.client-secret.name -- Client certificate secret name
      name: ""
    #  builder.framework.command -- Override command defined in the builder image
    command: ""
    #  builder.framework.image -- Set builder image
    image: gcr.io/kaniko-project/executor:latest
    #  builder.framework.image-prefix -- Sets the prefix that will be added to the image name
    image-prefix: ""
    #  builder.framework.name -- Configure which builder use to build OCI image (kaniko or buildkit)
    name: kaniko
    #  builder.framework.secret -- Specify the name of the secret that contains the registry credentials
    secret: ""
  # builder.kaniko -- Kaniko image registry configuration.
  kaniko:
    # builder.kaniko.imagePrefix -- Image prefix; empty inherits the framework image prefix.
    imagePrefix: ""
    # builder.kaniko.imageRegistry -- Registry; empty inherits the global registry URL.
    imageRegistry: ""

# cache -- Cache configuration.
cache:
  # cache.caffeineSpec -- Caffeine cache specification.
  caffeineSpec: maximumSize=10000,expireAfterWrite=600s

#  commonCredsSecret -- A secret that should be used when not using STS. It should contain the following populated keys:
#  DB_USERNAME: Username of the Postgres main db owner
#  DB_PASSWORD: Password of the Postgres main db owner
#  AWS_ACCESS_KEY_ID: Access key of the S3 Platform's main bucket user
#  AWS_SECRET_ACCESS_KEY: Secret key of the S3 Platform's main bucket user
#  DB_URL: Connection string to the platform's main db
#  DHCORE_CLIENT_ID: Core clientId
commonCredsSecret:
  #  commonCredsSecret.existingCommonCredsSecret -- Secret name
  secretName: ""

#  configmapAdditionalEnv -- Additional environment variables for the Core configmap, MUST be specified in key/value format
configmapAdditionalEnv: {}

# console -- Console configuration
console:
  # console.clarityKey -- Frontend Clarity integration key.
  clarityKey: ""
  #  console.containerImagesRegistry -- Registry configuration used by the console
  containerImagesRegistry:
    existingSecret:
      #  console.containerImagesRegistry.existingSecret.name -- Name of the secret containing the credentials for the registry used by the console.
      name: ""
      #  console.containerImagesRegistry.existingSecret.passwordKey -- Password key of the secret containing the credentials for the registry used by the console.
      passwordKey: ""
      #  console.containerImagesRegistry.existingSecret.usernameKey -- Username key of the secret containing the credentials for the registry used by the console.
      usernameKey: ""
    #  console.containerImagesRegistry.password -- Password for the registry used by the console.
    password: ""
    #  console.containerImagesRegistry.registryUrl -- Registry url used by the console.
    registryUrl: ""
    #  console.containerImagesRegistry.username -- Username for the registry used by the console.
    username: ""
  #  console.metrics -- Metrics configuration used for the console
  metrics:
    #  console.metrics.instance -- Metrics configuration used for display metrics in the console aggregated for instances
    instance:
    #  console.metrics.project -- Metrics configuration used for display metrics in the console aggregated for projects
    project:
    #  console.metrics.run -- Metrics configuration used for display metrics in the console aggregated for runs
    run:
    #  console.metrics.user -- Metrics configuration used for display metrics in the console aggregated for users
    user:

#  coreAuthCreds --
coreAuthCreds:
  #  coreAuthCreds.clientId -- Core clientId
  clientId: ""
  #  coreAuthCreds.clientSecret -- Core clientSecret
  clientSecret: ""
  #  coreAuthCreds.existingSecret -- Existing secret containing Core clientID and clientSecret
  existingSecret:
    #  coreAuthCreds.existingSecret.clientIdKey -- Key of the clientID
    clientIdKey: ""
    #  coreAuthCreds.existingSecret.clientSecretKey -- Key of the clientSecret
    clientSecretKey: ""
    #  coreAuthCreds.existingSecret.secretName -- Name of the secret with Core clientId and clientSecret
    secretName: ""

#  coreTokens --
coreTokens:
  #  coreTokens.accessTokenDuration -- Duration of the access token generated by Core in seconds
  accessTokenDuration: "43200"
  # coreTokens.jwksCacheControl -- JWKS response cache-control header.
  jwksCacheControl: public, max-age=900, must-revalidate, no-transform
  # coreTokens.redirectUris -- Allowed redirect URIs; empty uses localhost and the Core callback endpoint.
  redirectUris: ""
  #  coreTokens.refreshTokenDuration -- Duration of the refresh token generated by Core in seconds
  refreshTokenDuration: "86400"

#  corsOrigin --
corsOrigin: ""

#  customRoles -- Custom roles that can be used to grant access to Core resources.
customRoles: []

#  databaseProvider --
databaseProvider:
  #  databaseProvider.database -- Name of the main database of the platform
  database: ""
  #  databaseProvider.host -- Host of the main database of the platform
  host: ""
  # databaseProvider.platform -- Platform database engine.
  platform: postgresql
  #  databaseProvider.port -- Port of the main database of the platform
  port: ""

#  defaultStorageClass -- Default storage class that should be used
defaultStorageClass: ""

#  envoyGateway -- Envoy Gateway integration configuration.
#  Configure the following settings only if you use Envoy/EnvoyAI Gateway in your environment.
#  Utilization with any other gateway is not supported..
envoyGateway:
  #  envoyGateway.enabled -- Set this value to true if you want to enable the integration between Core and an Envoy Gateway
  enabled: false
  #  envoyGateway.aiGateway -- Configuration for an Envoy AI Gateway
  aiGateway:
    #  envoyGateway.aiGateway.enabled -- Enable/Disable the integration between Core and an Envoy AI Gateway
    enabled: false
    #  envoyGateway.aiGateway.endpoint -- Endpoint of the Envoy AI Gateway, in the format "servicename:port"
    endpoint: ""
    #  envoyGateway.aiGateway.name -- Name of the Envoy AI Gateway
    name: ""
  #  envoyGateway.genericGateway -- Configuration for a generic Envoy Gateway
  genericGateway:
    #  envoyGateway.genericGateway.enabled -- Enable/Disable the integration between Core and a generic Envoy Gateway
    enabled: false
    #  envoyGateway.genericGateway.endpoint -- Endpoint of the generic Envoy Gateway, in the format "servicename:port"
    endpoint: ""
    #  envoyGateway.genericGateway.name -- Name of the generic Envoy Gateway
    name: ""
  # envoyGateway.payloadLogger -- Payload logger configuration.
  payloadLogger:
    # envoyGateway.payloadLogger.host -- Payload logger host.
    host: ""
    # envoyGateway.payloadLogger.port -- Payload logger port.
    port: ""

# extensions -- Core extensions configuration.
extensions:
  # extensions.path -- Extension discovery path.
  path: classpath:/extensions/

# files -- File processing configuration.
files:
  # files.maxColumnSize -- Maximum file column size in bytes.
  maxColumnSize: 2097152

#  fullnameOverride -- String to fully override `core.fullname` template.
fullnameOverride: ""

#  healthcheck -- Core healthcheck configuration
healthcheck:
  #  healthcheck.enabled -- Enable/Disable healthcheck for Core
  enabled: true
  #  healthcheck.livenessProbe -- Liveness probe for Core
  livenessProbe:
    #  healthcheck.livenessProbe.path -- Handler path for liveness probe
    path: /health
    #  healthcheck.livenessProbe.periodSeconds -- Period seconds for liveness probe
    periodSeconds: 60
  #  healthcheck.livenessProbe -- Liveness probe for Core
  readinessProbe:
    #  healthcheck.readinessProbe.path -- Handler path for readiness probe
    path: /health
    #  healthcheck.readinessProbe.periodSeconds -- Period seconds for readiness probe
    periodSeconds: 60
  #  healthcheck.service -- Service configuration for healthcheck.
  service:
    #  healthcheck.service.port -- Port used by healthcheck service
    port: 8081
    #  healthcheck.service.portName -- Port name used by healthcheck service
    portName: management
    #  healthcheck.service.protocol -- Protocol used by healthcheck service
    protocol: TCP
  #  healthcheck.startupProbe -- Startup probe for Core
  startupProbe:
    #  healthcheck.startupProbe.failureThreshold -- Failure threshold for startup probe
    failureThreshold: 12
    #  healthcheck.startupProbe.path -- Handler path for startup probe
    path: /health
    #  healthcheck.startupProbe.periodSeconds -- Period seconds for startup probe
    periodSeconds: 10

#  image --
image:
  #  image.pullPolicy -- Image pull policy
  pullPolicy: IfNotPresent
  #  image.repository -- Image repository
  repository: ghcr.io/scc-digitalhub/digitalhub-core
  #  image.tag -- Image tag
  tag: ""

#  imagePullSecrets --
imagePullSecrets: []

#  ingress -- Ingress configuration.
ingress:
  #  ingress.enabled -- If set to true, the chart will be configured for Ingress utilization.
  enabled: false
  #  ingress.annotations -- Annotations to add to the Ingress resource.
  annotations: {}
  #  ingress.className -- Ingress class name to use in the Ingress resource.
  className: ""
  #  ingress.hosts -- List of hostnames in the Ingress rules.
  hosts: []
  #  ingress.tls -- TLS configuration for the Ingress resource.
  tls: []

#  initImage --
initImage:
  #  initImage.builderTool --
  builderTool:
    #  initImage.builderTool.image -- Cpre builder repository
    image: ghcr.io/scc-digitalhub/digitalhub-core-builder-tool
    #  initImage.builderTool.tag -- Core builder tag
    tag: 38f928d9

#  keystore --
keystore:
  #  keystore.existingSecret -- Reference to the Keystore secret of Core
  existingSecret:
    #  keystore.existingSecret.keyName --
    keyName: ""
    #  keystore.existingSecret.secretName -- Name of the keystore secret
    secretName: ""
  #  keystore.keystoreKid --
  keystoreKid: ""
  #  keystore.keystorePath -- Path in which the Keystore will be mounted
  keystorePath: /etc/keystore

#  kubeai --
kubeai:
  #  kubeai.enabled -- Enable/Disable KubeAI
  enabled: true
  #  kubeai.port -- KubeAi port
  port: ""
  #  kubeai.serviceName -- Kubei service name
  serviceName: ""

# logs -- Core logging configuration.
logs:
  # logs.kubernetesLevel -- Kubernetes framework log level.
  kubernetesLevel: INFO
  # logs.maxLength -- Maximum log length in bytes.
  maxLength: 2097152

#  loki -- Configure Core with an existing Loki instance. It is used to filter the logs of Core resources in Loki.
loki:
  #  loki.enabled -- Enable/Disable Loki integration
  enabled: false
  #  loki.credentials -- Credentials for the Loki instance. It can be specified either by using an existing secret or by providing the username and password directly.
  credentials:
    #  loki.credentials.existingSecret -- Reference to the secret containing the credentials for the Loki instance
    existingSecret:
      #  loki.credentials.existingSecret.name -- Name of the secret containing the credentials for the Loki instance
      name: ""
      #  loki.credentials.existingSecret.passwordKey -- Key corresponding to the password in the secret
      passwordKey: ""
      #  loki.credentials.existingSecret.usernameKey -- Key corresponding to the username in the secret
      usernameKey: ""
    #  loki.credentials.password -- Password for the Loki instance
    password: ""
    #  loki.credentials.username -- Username for the Loki instance
    username: ""
  #  loki.endpoint -- Endpoint of the Loki instance
  endpoint: ""
  #  loki.labels -- Labels that will have to match the ones set in Loki for filtering Core resources
  labels:
    applicationName: ""
    # loki.labels.namespace -- Namespace label used to filter logs.
    namespace: namespace
    project: dhcore_project
    run: dhcore_run
    user: dhcore_user
  #  loki.mapWithPrefix -- Whether to map labels with a prefix or not. If set to true, the labels will be mapped with the name of the tenant name as a prefix. If set to false, the labels will be mapped without any prefix.
  mapWithPrefix: true
  #  loki.organizationId -- Organization ID of the Loki instance.
  organizationId: ""

#  lucene -- Values for Lucene configuration
lucene:
  #  lucene.indexPath -- Set the path for Lucene and enables it
  indexPath: "/lucene/"
  #  lucene.persistence -- Lucene persistence configuration
  persistence:
    #  lucene.persistence.enabled -- Enable persistence for Lucene
    enabled: true
    #  lucene.persistence.accessMode -- Access mode for the Lucene persistent volume claim
    accessMode: ReadWriteOnce
    #  lucene.persistence.size -- Size for the Lucene persistent volume claim
    size: 10Gi
    #  lucene.persistence.storageClass -- Storage class for the Lucene persistent volume claim
    storageClass: ""
  #  lucene.reindex -- Reindex of Lucene
  reindex: always

#  nameOverride -- String to partially override `core.fullname` template (will maintain the release name)
nameOverride: ""

#  nodeSelector --
nodeSelector: {}

#  podAnnotations -- Annotations to add to each pod.
podAnnotations: {}

#  podLabels -- Labels to add to each pod.
podLabels: {}

#  podSecurityContext -- [Security context for pod](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
podSecurityContext:
  #  podSecurityContext.fsGroup -- Configure group id used to mount volumes
  fsGroup: 65532
  #  podSecurityContext.runAsNonRoot -- Pod allow run as root.
  runAsNonRoot: true
  #  podSecurityContext.seccompProfile -- Pod configure seccompProfile.
  seccompProfile:
    #  podSecurityContext.seccompProfile.type -- Pod configure seccompProfile type.
    type: RuntimeDefault

#  postgres --
postgres:
  #  postgres.credentials --
  credentials:
    #  postgres.credentials.existingSecret --
    existingSecret:
      #  postgres.credentials.existingSecret.name -- Secret containing the Core database user credentials
      name: ""
      #  postgres.credentials.existingSecret.passwordKey -- Core db user password key
      passwordKey:
      #  postgres.credentials.existingSecret.usernameKey -- Core db user username key
      usernameKey:
    #  postgres.credentials.password -- Core db user password
    password: ""
    #  postgres.credentials.username -- Core db user username
    username: ""
  #  postgres.database -- Name of the Core database
  database: ""
  # postgres.dialect -- Optional Hibernate dialect override; empty preserves dialect detection for PostgreSQL.
  dialect: ""
  # postgres.h2Console -- Enable the H2 console.
  h2Console: false
  #  postgres.host -- Host of the Core database
  host: ""
  #  postgres.port -- Port of the Core database
  port: ""
  #  postgres.schema -- Schema of the Core database
  schema: ""

# priorityClassName -- Name of the priority class, leave empty to not set any.
priorityClassName: ""

prometheus:
  #  prometheus.enabled -- Enable/Disable Prometheus integration
  enabled: false
  # prometheus.credentials -- Credentials for the Prometheus instance
  credentials:
    #  prometheus.credentials.existingSecret -- Reference to the secret containing the credentials for the Prometheus instance
    existingSecret:
      #  prometheus.credentials.existingSecret.name -- Name of the secret containing the credentials for the Prometheus instance
      name: ""
      #  prometheus.credentials.existingSecret.passwordKey -- Key corresponding to the password in the secret
      passwordKey: ""
      #  prometheus.credentials.existingSecret.usernameKey -- Key corresponding to the username in the secret
      usernameKey: ""
    #  prometheus.credentials.password -- Password for the Prometheus instance
    password: ""
    #  prometheus.credentials.username -- Username for the Prometheus instance
    username: ""
  #  prometheus.endpoint -- Endpoint of the Prometheus instance
  #  prometheus.endpoint -- Endpoint of the Prometheus instance
  endpoint: ""
  #  prometheus.labels -- Labels that will have to match the ones set in Prometheus for filtering Core resources
  labels:
    # prometheus.labels.instance -- Instance label used to filter Core resources in Prometheus
    instance: ""
    #  prometheus.labels.namespace -- Namespace label used to filter Core resources in Prometheus
    namespace: namespace
    #  prometheus.labels.project -- Project label used to filter Core resources in Prometheus
    project: dhcore_project
    #  prometheus.labels.run -- Run label used to filter Core resources in Prometheus
    run: dhcore_run
    #  prometheus.labels.user -- User label used to filter Core resources in Prometheus
    user: dhcore_user
  #  prometheus.lazyFilter -- Whether to enable lazy filtering on Prometheus queries
  lazyFilter: true
  #  prometheus.metrics -- Metrics configuration used for Prometheus queries
  metrics:
    #  prometheus.metrics.cpu -- CPU metric configuration
    cpu:
      #  prometheus.metrics.cpu.groupBy -- Dimension used to group metric values
      groupBy: container
      #  prometheus.metrics.cpu.label -- Label name used for metric exposure
      label: cpu
      #  prometheus.metrics.cpu.name -- Prometheus metric name
      name: container_cpu_usage_seconds_total
      #  prometheus.metrics.cpu.operation -- Prometheus operation applied to the metric
      operation: rate
      #  prometheus.metrics.cpu.quota -- Quota for the metric
      quota: ""
      #  prometheus.metrics.cpu.unit -- Metric unit
      unit: seconds
      #  prometheus.metrics.cpu.window -- Time window used by the metric operation
      window: 2m
    #  prometheus.metrics.cpuRequested -- CPU requested metric configuration
    cpuRequested:
      #  prometheus.metrics.cpuRequested.groupBy -- Dimension used to group metric values
      groupBy: container
      #  prometheus.metrics.cpuRequested.label -- Label name used for metric exposure
      label: cpu-requested
      #  prometheus.metrics.cpuRequested.name -- Prometheus metric name
      name: ""
      #  prometheus.metrics.cpuRequested.operation -- Prometheus operation applied to the metric
      operation: rate
      #  prometheus.metrics.cpuRequested.quota -- Quota for the metric
      quota: ""
      #  prometheus.metrics.cpuRequested.unit -- Metric unit
      unit: seconds
      #  prometheus.metrics.cpuRequested.window -- Time window used by the metric operation
      window: 2m
    #  prometheus.metrics.disk -- Disk metric configuration
    disk:
      #  prometheus.metrics.disk.groupBy -- Dimension used to group metric values
      groupBy: container
      #  prometheus.metrics.disk.label -- Label name used for metric exposure
      label: disk-{device}
      #  prometheus.metrics.disk.name -- Prometheus metric name
      name: container_fs_writes_bytes_total
      #  prometheus.metrics.disk.operation -- Prometheus operation applied to the metric
      operation: ""
      #  prometheus.metrics.disk.quota -- Quota for the metric
      quota: ""
      #  prometheus.metrics.disk.unit -- Metric unit
      unit: bytes
      #  prometheus.metrics.disk.window -- Time window used by the metric operation
      window: ""
    #  prometheus.metrics.gpu -- GPU metric configuration
    gpu:
      #  prometheus.metrics.gpu.groupBy -- Dimension used to group metric values
      groupBy: ""
      #  prometheus.metrics.gpu.label -- Label name used for metric exposure
      label: gpu-utilization
      #  prometheus.metrics.gpu.name -- Prometheus metric name
      name: ""
      #  prometheus.metrics.gpu.operation -- Prometheus operation applied to the metric
      operation: ""

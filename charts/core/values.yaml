  headServiceType: ClusterIP
  #  ray.job -- Job configuration for Ray
  job:
    #  ray.job.activeDeadlineSeconds -- Active deadline seconds for the Ray job
    activeDeadlineSeconds: 259200
    #  ray.job.resources -- Resource requests and limits for the Ray job
    resources:
      #  ray.job.resources.cpu -- CPU requests and limits for the Ray job
      cpu:
        #  ray.job.resources.cpu.limits -- CPU limits for the Ray job
        limits: 2
        #  ray.job.resources.cpu.requests -- CPU requests for the Ray job
        requests: 1
      #  ray.job.resources.ephemeralStorage -- Ephemeral storage requests and limits for the Ray job
      ephemeralStorage:
        #  ray.job.resources.ephemeralStorage.limits -- Ephemeral storage limits for the Ray job
        limits: 4Gi
        #  ray.job.resources.ephemeralStorage.requests -- Ephemeral storage requests for the Ray job
        requests: 2Gi
      #  ray.job.resources.memory -- Memory requests and limits for the Ray job
      memory:
        #  ray.job.resources.memory.limits -- Memory limits for the Ray job
        limits: 2Gi
        #  ray.job.resources.memory.requests -- Memory requests for the Ray job
        requests: 2Gi

    labels: {}
    #  route.main.matches -- List of matches for the HTTPRoute resource.
    matches:
      #  route.main.matches.path -- Path match for the HTTPRoute resource.
      - path:
          #  route.main.matches.path.type -- Type of path match for the HTTPRoute resource.
          type: PathPrefix

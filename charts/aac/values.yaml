# Default values for aac.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  externalHostAddress: ""
  externalTls: false

adminCreds:
  password: "admin"
  username: "admin"

adminExistingCreds:
  existingSecret: ""
  passKey: ""
  userKey: ""

affinity: {}

appCreds:
  existingSecret: ""

autoscaling:
  enabled: false
  maxReplicas: 100
  minReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

bootstrapCreds:
  existingSecret: ""

# AAC Config Map
config:
  applicationExtUrl: ""
  bootstrap: file:///home/aac/bootstrap.yaml
  bootstrapApply: "true"
  cacheJwks: "public, max-age=3600, must-revalidate, no-transform"
  jdbcDialect: org.hibernate.dialect.H2Dialect
  jdbcDriver: org.h2.Driver
  jdbcUrl: "jdbc:h2:file:./data/db"
  keystorePath: ""
  logLevel: DEBUG
  mailDebug: "false"
  mailHost: ""
  mailPort: 465
  mailProtocol: smtps
  mailSender: ""
  mailTls: "false"

fullnameOverride: ""

image:
  args:
    - "-Dspring-boot.run.arguments=--logging.level.ROOT=DEBUG"
    - "java"
    - "org.springframework.boot.loader.JarLauncher"
  pullPolicy: IfNotPresent
  repository: ghcr.io/scc-digitalhub/aac
  # Overrides the image tag whose default is the chart appVersion.
  tag: 5.3.0-beta3

imagePullSecrets: []

ingress:
  enabled: false
  annotations: {}
  className: ""
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - ""
      secretName: ""

jdbcExistingCreds:
  existingSecret: ""
  passwordKey: ""
  userKey: ""

# Secrets

# AAC default H2 database credentials. Do not set them if you are using an external one.
jdbcH2creds:
  password: ""
  user: ""

keystore:
  keyName: ""
  secretName: ""

mailCreds:
  existingSecret: ""
  passwordKey: ""
  usernameKey: ""

mailSecret:
  password: testPassword
  user: test@user.it

nameOverride: ""

nodeSelector: {}

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 805
  runAsGroup: 805
  runAsUser: 805

postgresOperator:
  adminUser: ""
  database: ""
  installed: false
  psqlClusterName: ""
  user: ""

realms: {}

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

route:
  #  route.enabled-- Enables or disables the route
  enabled: false
  #  route.additionalRules -- Additional custom rules that can be added to the route
  additionalRules: []
  #  route.annotations -- Annotations to add to the route
  annotations: {}
  #  route.apiVersion -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
  apiVersion: gateway.networking.k8s.io/v1
  extraLabels: {}
  #  route.filters -- Filters define the filters that are applied to requests that match this rule.
  filters: []
  #  route.hostnames -- Hostnames to match for the route
  hostnames: []
  # - "open-webui.example.com"

  #  route.httpsRedirect -- Enables HTTPS redirect for the route
  httpsRedirect: false
  #  route.kind -- Set the route kind
  #  Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
  kind: HTTPRoute
  #  route.labels -- Labels to add to the route
  labels: {}
  #  route.matches -- Match conditions for the route
  matches:
    - path:
        #  route.matches.path.type -- Path match type.
        type: PathPrefix
        #  route.matches.path.value -- Path match value
        value: /
  #  route.parentRefs -- References to the parent resources (e.g. Gateway)
  parentRefs: []
  # - name: my-gateway

  #  route.redirect -- Configuration for the HTTP-to-HTTPS redirect route (only used when httpsRedirect is true)
  #  If route.redirect.parentRefs is set, it will be used as-is for the redirect route's parentRefs.
  #  Otherwise, the main route's parentRefs are used with sectionName defaulting to "http".
  redirect: {}
  # parentRefs:
  #   - name: my-gateway
  #     sectionName: http

secrets:
  annotations: {}
  ## If you wish to generate clientId and clientSecrets randomly in the bootstrap (for example, using {{ randAlphaNum 24 | nospace }})
  ## make sure that you add pre-install hook to the annotations, so that the secrets won't get modified in case of a helm update.
  ## Example:
  # annotations:
  #   "helm.sh/hook": pre-install
  #   "helm.sh/hook-weight": "-5"
  reflector:
    enabled: false

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 805

service:
  httpNodePort: ""
  port: "8080"
  type: ClusterIP

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: aac

tolerations: []

upgradeJob:
  enabled: true
  args:
    - "--spring.profiles.active=bootstrap"
    - "-jar"
    - "java"
    - "target/aac.jar"
  backoffLimit: 1
  restartPolicy: Never

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /home/aac/bootstrap.yaml
    name: aac-volume
    subPath: bootstrap.yaml

# Additional volumes on the output Deployment definition.
volumes:
  - name: aac-volume
    secret:
      secretName: aac-bootstrap-secret

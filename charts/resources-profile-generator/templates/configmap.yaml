apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "resources-profile.fullname" . }}
  labels:
    {{- include "resources-profile.labels" . | nindent 4 }}
data:
  template-default.yaml: |
    id: default
    name: default
    description: Default profile
    labels:
      {{- if .Values.queue.enabled }}
      - name: kueue.x-k8s.io/queue-name
        value: {{ .Values.queue.name }}
      - name: kueue.x-k8s.io/priority-class
        value: {{ .Values.queue.workloadPriorityClassName }}
      {{- end }}
  template-cpu.yaml: |
    id: cpu
    name: cpu
    description: Generic CPU profile
    labels:
      {{- if .Values.queue.enabled }}
      - name: kueue.x-k8s.io/queue-name
        value: {{ .Values.queue.name }}
      - name: kueue.x-k8s.io/priority-class
        value: {{ .Values.queue.workloadPriorityClassName }}
      {{- end }}
  {{- if .Values.shareQueue.enabled }}
  template-cpu-shared.yaml: |
    id: cpu-shared
    name: cpu-shared
    description: Generic CPU profile
    labels:
      - name: kueue.x-k8s.io/queue-name
        value: {{ .Values.shareQueue.name }}
      - name: kueue.x-k8s.io/priority-class
        value: {{ .Values.shareQueue.workloadPriorityClassName }}
  {{- end }}
  {{- $cpuReqPercent := int (default 67 .Values.requests.cpuPercent) }}
  {{- $memReqPercent := int (default 67 .Values.requests.memoryPercent) }}
  {{- range $profile := .Values.profiles }}
  {{- $profileName := toString $profile.name }}
  {{- $gpuModel := toString $profile.gpu.name }}
  {{- $gpuMax := int $profile.gpu.number }}
  {{- $totalCpu := int $profile.cpu.count }}
  {{- $totalMemMi := include "resources-profile.memoryMi" $profile.memory.size | int }}
  {{- $totalMemGi := include "resources-profile.ceilDiv" (dict "num" $totalMemMi "den" 1024) | int }}
  {{- $descriptionGpuName := default $gpuModel $profile.gpu.displayName }}
  {{- range $gpuCount := untilStep (int 1) (int (add $gpuMax 1)) (int 1) }}
  {{- $limitCpu := include "resources-profile.ceilDiv" (dict "num" (mul $totalCpu $gpuCount) "den" $gpuMax) | int }}
  {{- $requestCpuRaw := div (mul $limitCpu $cpuReqPercent) 100 | int }}
  {{- $requestCpu := max (int 1) (int $requestCpuRaw) }}
  {{- if eq $gpuCount $gpuMax }}
  {{- $requestCpu = $limitCpu }}
  {{- end }}
  {{- $limitMemGi := include "resources-profile.ceilDiv" (dict "num" (mul $totalMemGi $gpuCount) "den" $gpuMax) | int }}
  {{- $requestMemRaw := div (mul $limitMemGi $memReqPercent) 100 | int }}
  {{- $requestMemGi := max (int 1) (int $requestMemRaw) }}
  {{- if eq $gpuCount $gpuMax }}
  {{- $requestMemGi = $limitMemGi }}
  {{- end }}
  template-{{ $gpuCount }}x{{ $profileName }}.yaml: |
    id: {{ $gpuCount }}x{{ $profileName }}
    name: {{ $gpuCount }}x{{ $profileName }}
    description: "{{ $gpuCount }} GPU Nvidia {{ $descriptionGpuName }}{{ if $profile.gpu.computeCapability }}. Compute capability version {{ $profile.gpu.computeCapability }}{{ end }}{{ if $profile.gpu.vRAM }}. Available VRAM per single GPU={{ $profile.gpu.vRAM }}{{ end }}. Maximum available resources: cpu={{ $limitCpu }}, RAM={{ $limitMemGi }}Gi,ephemeral-storage={{ $limitMemGi }}Gi"
    tolerations:
    - key: nvidia.com/gpu.model
      operator: Equal
      value: {{ $gpuModel }}
      effect: NoSchedule
    - key: nvidia.com/gpu.present
      operator: Equal
      value: "true"
      effect: NoSchedule
    labels:
      {{- if $.Values.queue.enabled }}
      - name: kueue.x-k8s.io/queue-name
        value: {{ $.Values.queue.name }}
      - name: kueue.x-k8s.io/priority-class
        value: {{ $.Values.queue.workloadPriorityClassName }}
      {{- end }}
    resources:
      {{- if $.Values.requests.enabled }}
      requests:
        cpu: "{{ $requestCpu }}"
        memory: "{{ $requestMemGi }}Gi"
        nvidia.com/gpu: "{{ $gpuCount }}"
        ephemeral-storage: "{{ $limitMemGi }}Gi"
      {{- end }}
      limits:
        cpu: "{{ $limitCpu }}"
        memory: "{{ $limitMemGi }}Gi"
        nvidia.com/gpu: "{{ $gpuCount }}"
        ephemeral-storage: "{{ $limitMemGi }}Gi"
    volumes:
      - name: shm
        mount_path: /dev/shm
        spec:
          medium: Memory
          size_limit: {{ $limitMemGi }}Gi
        volume_type: empty_dir
  {{- if $.Values.shareQueue.enabled }}
  template-{{ $gpuCount }}x{{ $profileName }}-shared.yaml: |
    id: {{ $gpuCount }}x{{ $profileName }}-shared
    name: {{ $gpuCount }}x{{ $profileName }}-shared
    description: "All the workload scheduled with this profile can be preempted at any time. {{ $gpuCount }} GPU Nvidia {{ $descriptionGpuName }}{{ if $profile.gpu.computeCapability }}. Compute capability version {{ $profile.gpu.computeCapability }}{{ end }}{{ if $profile.gpu.vRAM }}. Available VRAM per single GPU={{ $profile.gpu.vRAM }}{{ end }}. Maximum available resources: cpu={{ $limitCpu }}, RAM={{ $limitMemGi }}Gi,ephemeral-storage={{ $limitMemGi }}Gi"
    tolerations:
    - key: nvidia.com/gpu.model
      operator: Equal
      value: {{ $gpuModel }}
      effect: NoSchedule
    - key: nvidia.com/gpu.present
      operator: Equal
      value: "true"
      effect: NoSchedule
    labels:
      - name: kueue.x-k8s.io/queue-name
        value: {{ $.Values.shareQueue.name }}
      - name: kueue.x-k8s.io/priority-class
        value: {{ $.Values.shareQueue.workloadPriorityClassName }}
    resources:
      {{- if $.Values.requests.enabled }}
      requests:
        cpu: "{{ $requestCpu }}"
        memory: "{{ $requestMemGi }}Gi"
        nvidia.com/gpu: "{{ $gpuCount }}"
        ephemeral-storage: "{{ $limitMemGi }}Gi"
      {{- end }}
      limits:
        cpu: "{{ $limitCpu }}"
        memory: "{{ $limitMemGi }}Gi"
        nvidia.com/gpu: "{{ $gpuCount }}"
        ephemeral-storage: "{{ $limitMemGi }}Gi"
    volumes:
      - name: shm
        mount_path: /dev/shm
        spec:
          medium: Memory
          size_limit: {{ $limitMemGi }}Gi
        volume_type: empty_dir
  {{- end }}
  {{- end }}
  {{- end }}
